<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理アプリ(プロトタイプ)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>タスク管理</h1>
  </header>

  <main class="board" id="board">
    <section class="column" data-status="not_started">
      <div class="column-header">
        <h2>未着手</h2>
        <button type="button" class="add-btn" data-status="not_started">＋ タスクを追加</button>
      </div>
      <div class="sort-controls" data-status="not_started">
        <button type="button" class="sort-btn active" data-sort="manual">手動</button>
        <button type="button" class="sort-btn" data-sort="priority">優先度順</button>
        <button type="button" class="sort-btn" data-sort="dueDate">期限順</button>
      </div>
      <div class="card-list" data-status="not_started"></div>
    </section>

    <section class="column" data-status="in_progress">
      <div class="column-header">
        <h2>進行中</h2>
        <button type="button" class="add-btn" data-status="in_progress">＋ タスクを追加</button>
      </div>
      <div class="sort-controls" data-status="in_progress">
        <button type="button" class="sort-btn active" data-sort="manual">手動</button>
        <button type="button" class="sort-btn" data-sort="priority">優先度順</button>
        <button type="button" class="sort-btn" data-sort="dueDate">期限順</button>
      </div>
      <div class="card-list" data-status="in_progress"></div>
    </section>

    <section class="column" data-status="done">
      <div class="column-header">
        <h2>完了</h2>
        <button type="button" class="add-btn" data-status="done">＋ タスクを追加</button>
      </div>
      <div class="sort-controls" data-status="done">
        <button type="button" class="sort-btn active" data-sort="manual">手動</button>
        <button type="button" class="sort-btn" data-sort="priority">優先度順</button>
        <button type="button" class="sort-btn" data-sort="dueDate">期限順</button>
      </div>
      <div class="card-list" data-status="done"></div>
    </section>
  </main>

  <!-- タスク追加/編集 共通モーダル -->
  <div class="modal-overlay" id="taskModalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">タスクを追加</h2>
      <form id="taskForm">
        <div class="form-group">
          <label for="titleInput">タイトル <span class="required">必須</span></label>
          <input type="text" id="titleInput" maxlength="100">
          <p class="error-message" id="titleError">タイトルを入力してください</p>
        </div>
        <div class="form-group">
          <label for="descriptionInput">説明文</label>
          <textarea id="descriptionInput" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="dueDateInput">期限</label>
          <input type="date" id="dueDateInput">
        </div>
        <div class="form-group">
          <label for="priorityInput">優先度</label>
          <select id="priorityInput">
            <option value="high">高</option>
            <option value="medium" selected>中</option>
            <option value="low">低</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="deleteBtn">削除</button>
          <div class="modal-actions-right">
            <button type="button" class="btn btn-secondary" id="cancelBtn">キャンセル</button>
            <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
